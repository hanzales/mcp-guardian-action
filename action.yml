name: MCP Guardian
description: Scan MCP configuration files and enforce deterministic security gates.
author: Hanzales
branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Path to the MCP configuration file.
    required: true
  version:
    description: MCP Guardian release version without the leading v.
    required: false
    default: 0.6.0-preview.3
  fail-on:
    description: Minimum severity that fails the action (critical, high, medium, low, or none).
    required: false
    default: high
  format:
    description: Output format (text, json, or sarif).
    required: false
    default: text
  output:
    description: Optional report output path. SARIF reports should use a .sarif path.
    required: false
    default: ''
  working-directory:
    description: Directory in which to run the scan.
    required: false
    default: .
  comment:
    description: Add or update a pull request summary comment.
    required: false
    default: 'false'
  github-token:
    description: GitHub token used for pull request comments.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Report path when the output input is provided.
    value: ${{ steps.scan.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Download MCP Guardian
      id: download
      shell: bash
      env:
        GUARDIAN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64) rid="linux-x64" ;;
          macOS:ARM64) rid="osx-arm64" ;;
          macOS:X64) rid="osx-x64" ;;
          Windows:X64) rid="win-x64" ;;
          *) echo "Unsupported runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 2 ;;
        esac
        executable="mcp-guardian-${rid}"
        if [[ "$rid" == win-* ]]; then executable="${executable}.exe"; fi
        url="https://github.com/hanzales/mcp-guardian/releases/download/v${GUARDIAN_VERSION}/${executable}"
        install_dir="${RUNNER_TEMP}/mcp-guardian"
        mkdir -p "$install_dir"
        curl --fail --location --retry 3 --silent --show-error "$url" --output "$install_dir/$executable"
        chmod +x "$install_dir/$executable"
        echo "executable=$install_dir/$executable" >> "$GITHUB_OUTPUT"

    - name: Scan MCP configuration
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.format }}
        OUTPUT: ${{ inputs.output }}
        EXECUTABLE: ${{ steps.download.outputs.executable }}
      run: |
        set -euo pipefail
        args=(scan "$CONFIG" --fail-on "$FAIL_ON" --format "$FORMAT")
        if [[ -n "$OUTPUT" ]]; then
          mkdir -p "$(dirname "$OUTPUT")"
          args+=(--output "$OUTPUT")
        fi
        set +e
        "$EXECUTABLE" "${args[@]}"
        status=$?
        set -e
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "## MCP Guardian"
            echo ""
            echo "- Configuration: `$CONFIG`"
            echo "- Threshold: `$FAIL_ON`"
            if [[ "$status" -eq 0 ]]; then
              echo "- Result: ✅ No findings at or above the configured threshold"
            else
              echo "- Result: ❌ Findings reached the configured threshold (exit code `$status`)"
            fi
            if [[ -n "$OUTPUT" ]]; then echo "- Report: `$OUTPUT`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ -n "$OUTPUT" ]]; then echo "report-path=$OUTPUT" >> "$GITHUB_OUTPUT"; fi
        exit "$status"

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        EXECUTABLE: ${{ steps.download.outputs.executable }}
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_PATH: ${{ github.event_path }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/mcp-guardian-pr-report.json"
        body="$RUNNER_TEMP/mcp-guardian-pr-comment.json"
        "$EXECUTABLE" scan "$CONFIG" --fail-on none --format json > "$report"
        node - "$report" "$body" <<'NODE'
        const fs = require('fs');
        const [reportPath, bodyPath] = process.argv.slice(2);
        const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
        const findings = report.findings || [];
        const counts = Object.fromEntries(['Critical', 'High', 'Medium', 'Low'].map(level => [level, 0]));
        for (const finding of findings) {
          const level = String(finding.severity || 'Low');
          if (level in counts) counts[level]++;
        }
        const marker = '<!-- mcp-guardian-report -->';
        const lines = [
          marker,
          '## MCP Guardian Security Report',
          '',
          findings.length === 0 ? '✅ No findings detected.' : '❌ Findings detected.',
          '',
          '| Severity | Count |',
          '| --- | ---: |',
          `| Critical | ${counts.Critical} |`,
          `| High | ${counts.High} |`,
          `| Medium | ${counts.Medium} |`,
          `| Low | ${counts.Low} |`,
          '',
          findings.length === 0 ? '' : '### Findings',
          ...findings.slice(0, 20).map(f => `- **${f.ruleId}** — ${f.title || f.message || 'Security finding'}`),
          findings.length > 20 ? `- …and ${findings.length - 20} more finding(s)` : '',
          '',
          '_Generated by [MCP Guardian](https://github.com/hanzales/mcp-guardian)._'
        ].filter(Boolean).join('\n');
        fs.writeFileSync(bodyPath, JSON.stringify({ body: lines }));
        NODE
        event=$(cat "$EVENT_PATH")
        pr_number=$(node -e 'const e=JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(e.number));' "$EVENT_PATH")
        comments_url="https://api.github.com/repos/$REPOSITORY/issues/$pr_number/comments"
        headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
        comments="$RUNNER_TEMP/mcp-guardian-comments.json"
        curl --fail --silent --show-error "${headers[@]}" "$comments_url?per_page=100" -o "$comments"
        comment_id=$(node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const c=a.find(x=>x.body && x.body.includes("<!-- mcp-guardian-report -->")); process.stdout.write(c ? String(c.id) : "");' "$comments")
        if [[ -n "$comment_id" ]]; then
          curl --fail --silent --show-error -X PATCH "${headers[@]}" "$comments_url/$comment_id" -H 'Content-Type: application/json' --data-binary "@$body" >/dev/null
        else
          curl --fail --silent --show-error -X POST "${headers[@]}" "$comments_url" -H 'Content-Type: application/json' --data-binary "@$body" >/dev/null
        fi
